name: 构建镜像与部署

# push 到 main / dev：只构建并推送镜像到 GHCR
# 在 Actions 页面手动运行（选择分支）：构建 + 部署到 DEPLOY_HOST
# 静态站点容器，对外访问由独立仓库 AzurChess/azurchess-gateway 的 nginx-edge 负责
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: 计算镜像名
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/azurchess-home' }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
          EOF

      - name: 生成 .env
        run: |
          umask 077
          echo "IMAGE=${{ needs.build.outputs.image }}:${{ github.sha }}" > deploy/docker/.env

      - name: 上传配置并启动容器
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH' && (docker network inspect azur-edge >/dev/null 2>&1 || docker network create azur-edge)"
          scp deploy/docker/compose.yaml deploy/docker/.env "deploy:$DEPLOY_PATH/"
          ssh deploy "chmod 600 '$DEPLOY_PATH/.env'"
          printf '%s' "$GHCR_TOKEN" | ssh deploy "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh deploy "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans; rc=\$?; docker logout ghcr.io; exit \$rc"

      - name: 清理
        if: always()
        run: rm -f deploy/docker/.env ~/.ssh/id_deploy
