# =====================================================================
# azurchess-home 站点配置（官网首页：Azur Chess - 碧蓝战棋）
#
# 技术栈：Create React App（react-scripts 5）SPA + react-router
# 构建产物：/opt/manjuu/azurchess-home/build        （npm run build）
#          该目录被 .gitignore 忽略，是纯构建产物；esa.jsonc 的
#          assets.directory=./build 与 notFoundStrategy=singlePageApplication
#          均与本配置一致。
#
# 上线流程：
#   cd /opt/manjuu/azurchess-home && npm run build
#   sudo restorecon -Rv /opt/manjuu/azurchess-home   # 新文件打 SELinux context
#   sudo nginx -t && sudo systemctl reload nginx
#
# 与后端的关系：生产环境 serverConfig.js 中 user/game/file.azurchess.top
# 均为绝对地址（跨域直连，见 azurchesscloud.conf 的 CORS 处理），
# 官网 nginx 本身不代理 API；下方【可选】段留给改为同源 /api 路由时启用。
# =====================================================================

server {
    listen       80;
    listen       [::]:80;
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  azurchess.2d-gate.cc;

    # Cloudflare 回源用 HTTPS（SSL/TLS 为 Full / Full strict）。
    # Full 可用自签；Full strict 需换成 Cloudflare Origin CA 证书。
    ssl_certificate     /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    root  /opt/manjuu/azurchess-home/build;
    index index.html;

    # 特别竞拍时刻 tab（AzurAuction 服务同一进程托管静态与 WebSocket，监听 127.0.0.1:5173）
    # $connection_upgrade 复用 azurchesscloud.conf 中定义的 map（同一 http 上下文内全局可见，不可重复定义）
    location /auction/ {
        proxy_pass http://127.0.0.1:5173/;   # 尾部斜杠会剥掉 /auction/ 前缀
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA：深层路由（如 /gallery 刷新）回退到 index.html，交给 react-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRA 带 hash 的静态资源（/static/js|css|media），可长期缓存
    location /static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 文本资源压缩
    gzip on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# 【可选】若将 serverConfig.js 改为同源相对路径（/api/user 等），
# 取消下面注释，即可由本服务器按 setupProxy.js 的方式转发：
# location /api/user/ { proxy_pass http://127.0.0.1:7000/; proxy_http_version 1.1; }
# location /api/game/ { proxy_pass http://127.0.0.1:7001/; proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
# location /api/file/ { proxy_pass https://file.azurchess.top/; }
