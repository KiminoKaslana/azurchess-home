map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

#--------------------------------------------------
#        azurchess.2d-gate.cc
#--------------------------------------------------

server {
    listen 80;
    server_name azurchess.2d-gate.cc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name azurchess.2d-gate.cc;

    # 网页资源文件上传单个文件限制 250MB
    client_max_body_size 250m;

    ssl_certificate /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    # 拒绝扫描器流量
    location = /api/game/mcp {
        return 444;
    }

    location ^~ /api/game/mcp/ {
        return 444;
    }

    # 静态文件代理
    location /api/file/ {
        proxy_pass https://file.azurchess.2d-gate.cc/;
        proxy_ssl_server_name on;

        proxy_set_header Host file.azurchess.2d-gate.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/game/ {
        proxy_pass http://127.0.0.1:7001/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host game.azurchess.dev.2d-gate.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/user/ {
        proxy_pass http://127.0.0.1:7000/;
        proxy_http_version 1.1;

        proxy_set_header Host user.azurchess.dev.2d-gate.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 特别竞拍时刻 tab（竞拍服务同一进程托管静态与 WebSocket）
    location /auction/ {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRA dev server 的资源不带 hash，Cloudflare 会按扩展名缓存 4 小时，
        # 这里禁止 CDN/浏览器缓存，避免前端改动长时间不可见
        add_header Cache-Control "no-store, must-revalidate" always;

        # 绕过已被 Cloudflare 缓存的旧 bundle.js：HTML 本身不被缓存，
        # 改写资源 URL 即可让浏览器请求全新地址强制回源
        sub_filter_once on;
        sub_filter '/static/js/bundle.js' '/static/js/bundle.js?v=20260808';
        sub_filter_types text/html;
    }
}

#--------------------------------------------------
#        azurchess.dev.2d-gate.cc
#--------------------------------------------------

server {
    listen 80;
    server_name azurchess.dev.2d-gate.cc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name azurchess.dev.2d-gate.cc;

    ssl_certificate /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    # 官网已迁移至 azurchess.2d-gate.cc，旧域名整体跳转
    return 301 https://azurchess.2d-gate.cc$request_uri;
}

