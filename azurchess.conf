#--------------------------------------------------
#        napcat.2d-gate.cc
#--------------------------------------------------

server {
    listen 80;
    server_name napcat.2d-gate.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name napcat.2d-gate.cc;

    ssl_certificate /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:6099;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

#--------------------------------------------------
#        alsace.2d-gate.cc
#--------------------------------------------------

server {
    listen 80;
    server_name alsace.2d-gate.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alsace.2d-gate.cc;

    ssl_certificate /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5199;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 转发 WebSocket 升级（vite HMR 依赖，否则页面会不停自刷新重连）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
