map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

#--------------------------------------------------
#        azurchess.2d-gate.cc
#--------------------------------------------------

server {
    listen 80;
    server_name azurchess.2d-gate.cc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name azurchess.2d-gate.cc;

    ssl_certificate /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    location / {
        default_type application/json;
        return 200 '{"message":"Server Online"}';
    }
}

#--------------------------------------------------
#        azurchess.dev.2d-gate.cc
#--------------------------------------------------

server {
    listen 80;
    server_name azurchess.dev.2d-gate.cc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name azurchess.dev.2d-gate.cc;

    # 网页资源文件上传单个文件限制 250MB
    client_max_body_size 250m;

    ssl_certificate /etc/nginx/ssl/azurchess/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/azurchess/privkey.pem;

    # 拒绝扫描器流量
    location = /api/game/mcp {
        return 444;
    }

    location ^~ /api/game/mcp/ {
        return 444;
    }

    # 静态文件代理
    location /api/file/ {
        proxy_pass https://file.azurchess.2d-gate.cc/;
        proxy_ssl_server_name on;

        proxy_set_header Host file.azurchess.2d-gate.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/game/ {
        proxy_pass http://127.0.0.1:7001/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host game.azurchess.dev.2d-gate.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/user/ {
        proxy_pass http://127.0.0.1:7000/;
        proxy_http_version 1.1;

        proxy_set_header Host user.azurchess.dev.2d-gate.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

